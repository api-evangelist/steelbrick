name: Steelbrick
description: 'SteelBrick was a Configure-Price-Quote (CPQ) SaaS vendor backed by IVP and Shasta Ventures before
  it was acquired by Salesforce (announced December 2015, closed 2016) and folded into the product now shipped as
  Salesforce CPQ (formerly Salesforce Revenue Cloud). The steelbrick.com domain is no longer an independent surface:
  its apex 301-redirects to salesforce.com/sales/cpq/ and the www host serves a broken default CloudFront certificate.
  There is no standalone SteelBrick developer portal, documentation, or public API — any live API surface belongs
  to Salesforce CPQ. This profile is retained as a portfolio lead / acquisition record; enrichment found no independent
  API artifacts to harvest.'
